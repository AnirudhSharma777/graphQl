name: Gradle CI + Docker

on:
  push:
    branches:
      - develop
      - start

  pull_request:
    branches:
      - start

jobs:
  build-and-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      # - name: Run Tests
      #   run: ./gradlew test

      # ✅ Extract repo name only (remove owner)
      - name: Set image name
        run: echo "IMAGE_NAME=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)" >> $GITHUB_ENV

      # 🐳 Login to Docker Hub (only on main)
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/start'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🐳 Build Docker Image
      - name: Build Docker Image
        if: github.ref == 'refs/heads/start'
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      # 🐳 Push Docker Image
      - name: Push Docker Image
        if: github.ref == 'refs/heads/start'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
